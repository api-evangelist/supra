    source: openapi info.description
    note: >-
      The node's own build tag is the closest thing Supra publishes to an API release identifier, and it is only
      discoverable inside the OpenAPI description string or via GET /rpc/v3/version.
  version_endpoint: GET /rpc/v3/version (version_info_v3)
