description: >-
  Versioning, deprecation and operational-transparency posture for the Supra RPC Node API. Supra does something
  unusually good here and something unusually weak. The good part: it marks deprecation in the contract itself —
  19 of 56 operations carry deprecated:true, so a client generator or an agent can see the decay without reading
  a blog post. The weak part: there is no sunset date, no Deprecation or Sunset response header, no published
  deprecation policy, no dated API changelog, and no working public status page.
