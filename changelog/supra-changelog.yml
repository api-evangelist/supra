description: >-
  Supra publishes no dated changelog for its API. There is no release-notes page, no "what's new" section in the
  docs, and no versioned entry list — which is why apis.yml carries no ChangeLog pointer. What version
  information does exist is scattered across three unrelated places: the node build tag embedded in the OpenAPI
  description string, the node versions named in operator upgrade runbooks, and a dated CLI note on the CLI
  commands pages. An integrator cannot answer "what changed in the API last month" from any Supra surface.
