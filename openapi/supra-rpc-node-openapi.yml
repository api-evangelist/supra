          $ref: '#/components/schemas/CertificateThresholdType'
          description: 'The type of threshold that `signature` satisfies with respect to the [Committee]

            that created this [sosmr::Certificate].'
        signature:
          type: object
          description: A signature on the [CertificateSignatureData] transformation of `data`.
        voters:
          type: array
          items:
            type: boolean
          description: 'Identifies the nodes whose signatures were used to construct `signature`.

            Each index corresponds to an index in the vector of public keys of the

            participants in the corresponding committee, with its value being set

            to `true` if the participant''s signature was included in `signature`.'
    Certificate_TransactionsInclusionCertificationData:
      type: object
      required:
      - certifying_committee
      - data
      - kind
      - signature
      - voters
      properties:
        certifying_committee:
          $ref: '#/components/schemas/Hash'
          description: The hash digest of the [Committee] that created this [sosmr::Certificate].
        data:
          $ref: '#/components/schemas/TransactionsInclusionCertificationData'
          description: The data from which `signature` is derived.
        kind:
          $ref: '#/components/schemas/CertificateThresholdType'
          description: 'The type of threshold that `signature` satisfies with respect to the [Committee]

            that created this [sosmr::Certificate].'
        signature:
          type: object
          description: A signature on the [CertificateSignatureData] transformation of `data`.
        voters:
          type: array
          items:
            type: boolean
          description: 'Identifies the nodes whose signatures were used to construct `signature`.

            Each index corresponds to an index in the vector of public keys of the

            participants in the corresponding committee, with its value being set

            to `true` if the participant''s signature was included in `signature`.'
    CertifiedBlock:
      type: object
      description: 'An [SmrBlock] certified by an [SmrQC].

        '
      required:
      - block
      - qc
      properties:
        block:
          $ref: '#/components/schemas/SmrBlock'
        qc:
          $ref: '#/components/schemas/SmrQC'
    CommitteeAuthorization:
      type: object
      description: 'A certificate indicating that the Committee with the hash digest contained in the

        related committee info is authorized to govern the related epoch.'
      required:
      - certificate
      properties:
        certificate:
          $ref: '#/components/schemas/Certificate_CommitteeInfo'
    CommitteeInfo:
      type: object
      description: Metadata about a Committee required to construct a committee authorization.
      required:
      - epoch_id
      - hash
      properties:
        epoch_id:
          $ref: '#/components/schemas/EpochId'
          description: The epoch-id of the related Committee.
        hash:
          $ref: '#/components/schemas/Hash'
          description: The hash digest of the related Committee.
    CommitteeV0:
      type: object
      description: 'A committee of validators operating as a subset of the Supra blockchain network.

        Each Committee is assigned to perform a task for the duration of its associated epoch.'
      required:
      - epoch_info
      - members
      properties:
        bls_threshold_public_key:
          type:
          - string
          - 'null'
          description: The BLS threshold public key of the Committee.
        epoch_info:
          $ref: '#/components/schemas/EpochInfo'
          description: Metadata about the epoch for which this Committee is authorized.
        members:
          type: object
          description: 'An ordered map of the ids of the nodes participating in this Committee to their

            remaining metadata.'
          additionalProperties:
            $ref: '#/components/schemas/ValidatorV0'
          propertyNames:
            type: string
            description: Hex encoded identity.
    CommitteeV1:
      type: object
      description: 'A V1 committee of validators operating as a subset of the Supra blockchain network.

        Each Committee is assigned to perform a task for the duration of its associated epoch.'
      required:
      - bls_threshold_public_keys
      - epoch_info
      - members
      properties:
        bls_threshold_public_keys:
          type: object
          description: The BLS threshold public keys of the Committee for each threshold type.
          additionalProperties:
            type: string
          propertyNames:
            type: string
            enum:
            - Validity
            - Quorum
            - Unanimous
            - BcftValidity
            - BcftQuorum
            - BcftFallbackViewChange
            - ClanMajority
        epoch_info:
          $ref: '#/components/schemas/EpochInfo'
          description: Metadata about the epoch for which this Committee is authorized.
        members:
          type: object
          description: 'An ordered map of the ids of the nodes participating in this Committee to their

            remaining metadata.'
          additionalProperties:
            $ref: '#/components/schemas/ValidatorV1'
          propertyNames:
            type: string
            description: Hex encoded identity.
    ConsensusBlock:
      type: object
      description: The API representation of a Supra Certified Consensus block.
      required:
      - block
      - batches
      properties:
        block:
          $ref: '#/components/schemas/CertifiedBlock'
        batches:
          type: object
          description: 'The API representations of all batches of transactions

            that were finalized by this block in the order that they were executed.'
    EpochId:
      type: object
      required:
      - chain_id
      - epoch
      properties:
        chain_id:
          oneOf:
          - type: integer
            format: u-int8
            minimum: 0
          description: Unique identifier for this instance of the SMR.
        epoch:
          oneOf:
          - type: integer
            format: u-int64
            minimum: 0
          description: Identifier of the epoch within the context of `chain_id`.
    EpochInfo:
      type: object
      description: Metadata about an epoch.
      required:
      - id
      - start_height
      - start_time
      properties:
        id:
          $ref: '#/components/schemas/EpochId'
          description: The unique identifier for this epoch.
        start_height:
          type: integer
          format: u-int64
          description: The height of the final block of the previous epoch.
          minimum: 0
        start_time:
          $ref: '#/components/schemas/SmrTimestamp'
          description: The timestamp of the final block of the previous epoch.
    ErrResp:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    EventEmissionProof:
      type: object
      description: Proof of an event's emission within a transaction's events tree.
      required:
      - proof
      - merkle_root_hash_value
      - leaf_hash_value
      - leaf_index
      properties:
        proof:
          $ref: '#/components/schemas/AccumulatorProof'
          description: The accumulator proof for the event.
        merkle_root_hash_value:
          $ref: '#/components/schemas/Hash'
          description: Hex encoded merkle root hash value.
        leaf_hash_value:
          $ref: '#/components/schemas/Hash'
          description: Hex encoded hash value of the leaf node.
        leaf_index:
          type: integer
          format: u-int64
          description: The leaf index in the events accumulator tree.
          minimum: 0
    EventEmissionProofEntry:
      type: object
      description: 'A single matched event''s emission proof plus the metadata needed to correlate it back to

        the caller''s request.'
      required:
      - event_hash
      - event_type
      - event_index
      - event_emission_proof
      properties:
        event_hash:
          $ref: '#/components/schemas/Hash'
        event_type:
          type: string
          description: 'Echo of the matched event type. For Move events this is the fully qualified TypeTag

            (e.g. `0x1::coin::CoinDeposit`); for EVM events this is the canonical Solidity signature

            (e.g. `Transfer(address,address,uint256)`) the caller supplied.'
        event_index:
          type: integer
          format: u-int64
          description: Position of the event within the transaction's emitted-events list.
          minimum: 0
        event_emission_proof:
          $ref: '#/components/schemas/EventEmissionProof'
    EventEmissionProofsBatchItem:
      type: object
      description: 'Per-transaction selector. Both Move and EVM transactions are supported; the format of each

        entry in `event_types` is dispatched off the transaction''s VM.'
      required:
      - transaction_hash
      - event_types
      properties:
        transaction_hash:
          $ref: '#/components/schemas/Hash'
        event_types:
          type: array
          items:
            type: string
          description: "Event type selectors. Format depends on the transaction's VM:\n\n- **Move:** fully qualified `TypeTag`\
            \ strings, e.g. `0x1::coin::CoinDeposit`. Each entry\n  must parse via `TypeTag::from_str`.\n- **EVM:** canonical\
            \ Solidity event signatures, e.g. `Transfer(address,address,uint256)`\n  (no parameter names, no whitespace).\
            \ The server computes\n  `topic[0] = keccak256(signature)` and matches against each log's first topic.\n\nDuplicates\
            \ are deduplicated server-side. An entry that matches zero events in the\ntransaction is not an error; the corresponding\
            \ output simply omits it from the\nper-transaction `events` array."
    EventEmissionProofsBatchItemResponse:
      type: object
      description: 'Per-transaction proof bundle. A single `transaction_inclusion_proof` is shared across all

        matched events in the same transaction.'
      required:
      - transaction_hash
      - vm
      - transaction_inclusion_proof
      - events
      properties:
        transaction_hash:
          $ref: '#/components/schemas/Hash'
        vm:
          $ref: '#/components/schemas/Vm'
          description: 'VM that produced this transaction. Tells the verifier which root in the shared

            `inclusion_certificate` to check the `transaction_inclusion_proof` against.'
        transaction_inclusion_proof:
          $ref: '#/components/schemas/TransactionInclusionProof'
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventEmissionProofEntry'
          description: 'One entry per event in the transaction whose type was in the requested set, in the order

            the events were emitted. Empty if no event matched.'
    EventEmissionProofsBatchRequest:
      type: object
      description: Request body for `POST /rpc/v4/proofs/event-emissions`.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventEmissionProofsBatchItem'
          description: 'One entry per transaction. Each entry resolves to zero-or-more event emission proofs

            matching the requested types within that transaction.'
    EventEmissionProofsBatchResponse:
      type: object
      description: 'Response body for `POST /rpc/v4/proofs/event-emissions`.


        All proofs in the response are anchored to a single inclusion certificate at

        `block_height`. A cross-chain verifier can verify the certificate''s committee aggregate

        signature once and then verify each per-leaf Merkle path against the certificate''s

        accumulator root.'
      required:
      - block_height
      - inclusion_certificate
      - items
      properties:
        block_height:
          $ref: '#/components/schemas/u64'
          description: 'Block height at which the inclusion certificate was issued. All `transaction_inclusion_proof`

            values in this response are anchored to the accumulator frontier at this height.'
        inclusion_certificate:
          $ref: '#/components/schemas/Certificate_TransactionsInclusionCertificationData'
          description: 'Committee-signed certificate over the MoveVM and EVM accumulator roots at `block_height`.

            Verifying this certificate once attests to both roots; per-leaf Merkle paths in `items`

            are then verified against the certificate''s MoveVM root.'
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventEmissionProofsBatchItemResponse'
          description: 'One entry per request `items` entry, in the same order. Each entry carries the

            transaction-inclusion proof and zero-or-more matched event-emission proofs.'
    EventV1:
      type: object
      description: On-chain event.
      required:
      - guid
      - sequence_number
      - type
      - data
      properties:
        guid:
          $ref: '#/components/schemas/Guid'
          description: The globally unique identifier of this event stream.
        sequence_number:
          type: string
        type:
          type: string
          description: The `MoveType` of the event
        data:
          description: The JSON representation of the event
    EventV2:
      type: object
