        data:
          $ref: '#/components/schemas/EventWithContextV4'
    EvmTransactionOutput:
      oneOf:
      - type: object
        description: Returned successfully
        required:
        - Success
        properties:
          Success:
            type: object
            description: Returned successfully
            required:
            - reason
            - gas_used
            - gas_refunded
