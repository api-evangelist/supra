            description: A vector Move type.  May have any other [`MoveValue`] nested inside it
      - type: object
        description: 'All bytes (Vec<u8>) data is represented as hex-encoded string prefixed with `0x` and fulfilled with

          two hex digits per byte.


          Unlike the `Address` type, HexEncodedBytes will not trim any zeros.'
        required:
        - Bytes
        properties:
          Bytes:
            type: string
            description: 'All bytes (Vec<u8>) data is represented as hex-encoded string prefixed with `0x` and fulfilled with

              two hex digits per byte.


              Unlike the `Address` type, HexEncodedBytes will not trim any zeros.'
      - type: object
        description: "This is a JSON representation of some data within an account resource. More specifically,\nit is a map\
          \ of strings to arbitrary JSON values / objects, where the keys are top level\nfields within the given resource.\n\
          \nTo clarify, you might query for 0x1::account::Account and see the example data.\n\nMove `bool` type value is serialized\
          \ into `boolean`.\n\nMove `u8`, `u16` and `u32` type value is serialized into `integer`.\n\nMove `u64`, `u128` and\
          \ `u256` type value is serialized into `string`.\n\nMove `address` type value (32 byte Supra account address) is\
          \ serialized into a HexEncodedBytes string.\nFor example:\n  - `0x1`\n  - `0x1668f6be25668c1a17cd8caf6b8d2f25`\n\
          \nMove `vector` type value is serialized into `array`, except `vector<u8>` which is serialized into a\nHexEncodedBytes\
          \ string with `0x` prefix.\nFor example:\n  - `vector<u64>{255, 255}` => `[\\\"255\\\", \\\"255\\\"]`\n  - `vector<u8>{255,\
          \ 255}` => `0xffff`\n\nMove `struct` type value is serialized into `object` that looks like this (except some Move\
          \ stdlib types, see the following section):\n  ```json\n  {\n    field1_name: field1_value,\n    field2_name: field2_value,\n\
          \    ......\n  }\n  ```\n\nFor example:\n  `{ \\\"created\\\": \\\"0xa550c18\\\", \\\"role_id\\\": \\\"0\\\" }`\n\
          \n**Special serialization for Move stdlib types**:\n  - [0x1::string::String]\n    is serialized into `string`.\
          \ For example, struct value `0x1::string::String{bytes: b\\\"Hello World!\\\"}`\n    is serialized as `\\\"Hello\
          \ World!\\\"` in JSON.\n"
        required:
        - Struct
        properties:
          Struct:
            type: object
            description: "This is a JSON representation of some data within an account resource. More specifically,\nit is\
              \ a map of strings to arbitrary JSON values / objects, where the keys are top level\nfields within the given\
              \ resource.\n\nTo clarify, you might query for 0x1::account::Account and see the example data.\n\nMove `bool`\
              \ type value is serialized into `boolean`.\n\nMove `u8`, `u16` and `u32` type value is serialized into `integer`.\n\
              \nMove `u64`, `u128` and `u256` type value is serialized into `string`.\n\nMove `address` type value (32 byte\
              \ Supra account address) is serialized into a HexEncodedBytes string.\nFor example:\n  - `0x1`\n  - `0x1668f6be25668c1a17cd8caf6b8d2f25`\n\
              \nMove `vector` type value is serialized into `array`, except `vector<u8>` which is serialized into a\nHexEncodedBytes\
              \ string with `0x` prefix.\nFor example:\n  - `vector<u64>{255, 255}` => `[\\\"255\\\", \\\"255\\\"]`\n  - `vector<u8>{255,\
              \ 255}` => `0xffff`\n\nMove `struct` type value is serialized into `object` that looks like this (except some\
              \ Move stdlib types, see the following section):\n  ```json\n  {\n    field1_name: field1_value,\n    field2_name:\
              \ field2_value,\n    ......\n  }\n  ```\n\nFor example:\n  `{ \\\"created\\\": \\\"0xa550c18\\\", \\\"role_id\\\
              \": \\\"0\\\" }`\n\n**Special serialization for Move stdlib types**:\n  - [0x1::string::String]\n    is serialized\
              \ into `string`. For example, struct value `0x1::string::String{bytes: b\\\"Hello World!\\\"}`\n    is serialized\
              \ as `\\\"Hello World!\\\"` in JSON.\n"
      - type: object
        description: A string Move type
        required:
        - String
        properties:
          String:
            type: string
            description: A string Move type
      description: An enum of the possible Move value types.
