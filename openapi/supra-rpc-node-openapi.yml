  /rpc/v4/events/{event_type}:
    get:
      tags:
      - Events
      summary: Get events by type (v4)
      description: "If `include_proof` is set to `true`, this returns the event emission proof for each event,\nalong with\
        \ the corresponding transaction inclusion proof in which the event was emitted.\n\nThe following code demonstrates\
        \ event and transaction Merkle proof verification in a Solidity\nsmart contract:\n\n```solidity\n// SPDX-License-Identifier:\
        \ MIT\npragma solidity ^0.8.26;\n\ncontract MerkleProof {\n    bytes public TRANSACTION_MERKEL_PREFIXED_HASH_SALT\
        \ =\n        bytes(\"SUPRA::TransactionAccumulator\");\n    bytes public EVENT_MERKEL_PREFIXED_HASH_SALT =\n     \
        \   bytes(\"SUPRA::EventAccumulator\");\n    bytes32 public immutable TRANSACTION_MERKEL_PREFIXED_HASH =\n       \
        \ keccak256(TRANSACTION_MERKEL_PREFIXED_HASH_SALT);\n    bytes32 public immutable EVENT_MERKEL_PREFIXED_HASH =\n \
        \       keccak256(EVENT_MERKEL_PREFIXED_HASH_SALT);\n\n    function verify(\n        bytes32[] memory proof,\n   \
        \     bytes32 root,\n        bytes32 leaf,\n        uint256 index,\n        bool isTransactionMerkel\n    ) public\
        \ view returns (bool) {\n        bytes32 hash = leaf;\n        bytes32 PREFIXED_HASH;\n        if (isTransactionMerkel)\
        \ {\n            PREFIXED_HASH = TRANSACTION_MERKEL_PREFIXED_HASH;\n        } else {\n            PREFIXED_HASH =\
        \ EVENT_MERKEL_PREFIXED_HASH;\n        }\n\n        for (uint256 i = 0; i < proof.length; i++) {\n            bytes32\
        \ proofElement = proof[i];\n            if (index % 2 == 0) {\n                hash = keccak256(\n               \
        \     bytes.concat(PREFIXED_HASH, hash, proofElement)\n                );\n            } else {\n                hash\
        \ = keccak256(\n                    bytes.concat(PREFIXED_HASH, proofElement, hash)\n                );\n        \
        \    }\n            index = index / 2;\n        }\n        return hash == root;\n    }\n}\n```"
      operationId: events_by_type_v4
      parameters:
      - name: start_height
        in: query
        description: Starting block height (inclusive). Optional.
        required: false
        schema:
          type: integer
          format: u-int64
          minimum: 0
      - name: end_height
        in: query
        description: Ending block height (exclusive). Optional.
        required: false
        schema:
          type: integer
          format: u-int64
          minimum: 0
      - name: limit
        in: query
        description: Maximum number of events to return. Defaults to 20, max 100.
        required: false
        schema:
          type: integer
          minimum: 0
      - name: start
        in: query
        description: 'The cursor to start the query from. Optional.


          During a paginated query, the cursor returned in the `X_SUPRA_CURSOR` response header

          should be specified as the `start` parameter of the request for the next page.'
        required: false
        schema:
          type: string
      - name: include_proof
        in: query
        description: 'If set to `true`, includes the Merkle proofs for the related transaction''s inclusion in the

          executed transaction log and the event''s inclusion in the output of that transaction,

          in the response.'
        required: false
        schema:
          type: boolean
      - name: event_type
        in: path
        description: 'The fully qualified name of the event struct, i.e.: `contract_address::module_name::event_struct_name`.
          E.g. `0x1::coin::CoinDeposit`'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of Events contained in blocks
          headers:
            x-supra-chain-id:
              schema:
                type: integer
                format: u-int8
                minimum: 0
              description: Chain ID of the current chain.
            x-supra-cursor:
              schema:
                type: string
              description: Cursor specifying where to start for pagination. This cursor cannot be derived manually client-side.
                Instead, you must call this endpoint once without this query parameter specified, and then use the cursor
                returned in the x-supra-cursor header in the response.
            x-supra-oldest-block:
              schema:
                type: integer
                format: u-int8
                minimum: 0
              description: Height of the oldest available block. Absent until the archive has indexed at least one block.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsV4'
        '410':
          description: All data in the requested range has been pruned and is no longer available.
          headers:
            x-supra-chain-id:
              schema:
                type: integer
                format: u-int8
                minimum: 0
              description: Chain ID of the current chain.
            x-supra-oldest-block:
              schema:
                type: integer
                format: u-int8
                minimum: 0
              description: Height of the oldest available block.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrResp'
        '503':
          description: The archive is still initializing. No executed blocks are available yet. Please retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrResp'
  /rpc/v4/proofs/events:
    post:
      tags:
      - Proofs
      summary: Get a batch of event-emission proofs anchored to a single inclusion certificate (v4)
      description: "Resolves a batch of `(transaction_hash, event_types)` selectors into:\n  - one transactions-inclusion\
        \ certificate at the node's latest certified block height\n    (covers both MoveVM and EVM accumulator roots),\n \
        \ - one transaction inclusion proof per requested transaction, anchored to the appropriate\n    per-VM accumulator\
        \ root at that height,\n  - one event emission proof for every event in each transaction whose type matches one of\n\
        \    the caller's requested `event_types`.\n\nBoth Move and EVM transactions are supported in the same request; the\
        \ response's per-item\n`vm` field tells the verifier which root in the shared certificate the proof is anchored to:\n\
        \  - Move: `event_types` entries are `TypeTag` strings like `0x1::coin::CoinDeposit`.\n  - EVM: `event_types` entries\
        \ are canonical Solidity event signatures like\n    `Transfer(address,address,uint256)`. The server keccak256-hashes\
        \ each signature and\n    matches against each log's `topic[0]`.\n\nAll returned proofs share a single certificate\
        \ so cross-chain verifiers can verify the\ncommittee aggregate signature once and then check each Merkle path against\
        \ the shared root,\ninstead of re-verifying the certificate N times for N events.\n\nLimitations in this version:\n\
        \  - The certificate is always pinned to the node's latest certified height.\n  - At most 100 items per request and\
        \ 500 resolved events across the batch.\n  - Only transactions with Move or EVM outputs are supported.\n\nAn empty\
        \ `events` array for a transaction is not an error - it simply means none of the\nrequested `event_types` were emitted\
        \ by that transaction."
      operationId: proofs_events_v4
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventEmissionProofsBatchRequest'
        required: true
      responses:
        '200':
          description: Batch of transaction inclusion and event emission proofs anchored to a single inclusion certificate.
          headers:
            x-supra-chain-id:
              schema:
                type: integer
                format: u-int8
                minimum: 0
              description: Chain ID of the current chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventEmissionProofsBatchResponse'
            application/x-bcs:
              schema:
                type: array
                items:
                  type: integer
                  format: u-int8
                  minimum: 0
            application/octet-stream:
              schema:
                type: array
                items:
                  type: integer
                  format: u-int8
                  minimum: 0
        '400':
          description: Malformed request, batch too large, unknown transaction hash, unsupported transaction type in batch,
            or invalid event type.
          headers:
            x-supra-chain-id:
              schema:
                type: integer
                format: u-int8
                minimum: 0
              description: Chain ID of the current chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrResp'
            application/x-bcs:
              schema:
                $ref: '#/components/schemas/ErrResp'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrResp'
        '404':
          description: No inclusion certificate is currently available on this node.
          headers:
            x-supra-chain-id:
              schema:
                type: integer
                format: u-int8
                minimum: 0
              description: Chain ID of the current chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrResp'
            application/x-bcs:
              schema:
                $ref: '#/components/schemas/ErrResp'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrResp'
  /rpc/v4/proofs/events/{event_hash}/transaction/{transaction_hash}:
    get:
      tags:
      - Proofs
      summary: Get a single event emission proof (v4)
      description: 'This endpoint provides an event emission proof for the given event hash within the specified

        transaction. The returned proof verifies that the given event was emitted as part of that given

        transaction.'
      operationId: proofs_event_emission_proof_v4
      parameters:
      - name: event_hash
        in: path
        required: false
        schema:
          $ref: '#/components/schemas/Hash'
      - name: transaction_hash
        in: path
        required: false
        schema:
          $ref: '#/components/schemas/Hash'
      responses:
        '200':
          description: Emission proof data of the given event.
          headers:
            x-supra-chain-id:
              schema:
                type: integer
                format: u-int8
                minimum: 0
              description: Chain ID of the current chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventEmissionProof'
            application/x-bcs:
              schema:
                type: array
                items:
                  type: integer
                  format: u-int8
                  minimum: 0
            application/octet-stream:
              schema:
                type: array
                items:
                  type: integer
                  format: u-int8
                  minimum: 0
        '400':
          description: Malformed event or transaction hash provided.
          headers:
            x-supra-chain-id:
              schema:
                type: integer
                format: u-int8
                minimum: 0
              description: Chain ID of the current chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrResp'
            application/x-bcs:
              schema:
                $ref: '#/components/schemas/ErrResp'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrResp'
        '404':
          description: The specified transaction hash does not exist.
          headers:
            x-supra-chain-id:
              schema:
                type: integer
                format: u-int8
                minimum: 0
              description: Chain ID of the current chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrResp'
            application/x-bcs:
              schema:
                $ref: '#/components/schemas/ErrResp'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrResp'
  /rpc/v4/transactions/certificates:
    get:
      tags:
      - Transactions
      summary: Get transaction inclusion certificates by block height (v4)
      description: 'Provides transaction inclusion certificates for the specified block height range. These

        certificates enable verification that Move and EVM transaction Merkle root accumulator was

        accepted by the consensus committee.


        Both MoveVM and EVM transaction Merkle root accumulator is updated at every block. Each update

        goes through a transaction inclusion certification phase, during which consensus committee

        members vote on the proposed accumulator root.


        Verifying these certificates allows one to conclude that a specific transaction was

        submitted to and accepted by the Supra Network.


        '
      operationId: transactions_inclusion_certificates_by_block_height_v4
      parameters:
      - name: start_height
        in: query
        description: Starting block height.
        required: true
        schema:
          type: integer
          format: u-int64
          minimum: 0
      - name: end_height
        in: query
        description: Ending block height.
        required: true
        schema:
          type: integer
          format: u-int64
          minimum: 0
      responses:
        '200':
          description: Transactions inclusion certificate for the given block height.
          headers:
            x-supra-chain-id:
              schema:
                type: integer
                format: u-int8
                minimum: 0
              description: Chain ID of the current chain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsInclusionCertificates'
            application/x-bcs:
              schema:
                type: array
                items:
                  type: integer
                  format: u-int8
                  minimum: 0
            application/octet-stream:
              schema:
                type: array
                items:
                  type: integer
                  format: u-int8
                  minimum: 0
        '404':
          description: Requested data is not available.
          headers:
            x-supra-chain-id:
              schema:
                type: integer
                format: u-int8
                minimum: 0
              description: Chain ID of the current chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrResp'
            application/x-bcs:
              schema:
                $ref: '#/components/schemas/ErrResp'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrResp'
        '410':
          description: Requested data has been pruned and is no longer available.
          headers:
            x-supra-chain-id:
              schema:
                type: integer
                format: u-int8
                minimum: 0
              description: Chain ID of the current chain.
            x-supra-oldest-block:
              schema:
                type: integer
                format: u-int8
                minimum: 0
              description: Block height of the oldest available transactions inclusion certificate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrResp'
            application/x-bcs:
              schema:
                $ref: '#/components/schemas/ErrResp'
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrResp'
  /rpc/v4/transactions/{hash}:
    get:
      tags:
      - Transactions
      summary: Get transaction by hash (v4)
      description: Get information about a transaction by its hash.
      operationId: transaction_by_hash_v4
      parameters:
      - name: type
        in: query
        description: Transaction type to query. If missing any/all type of transactions will be looked for.
        required: false
        schema:
          type: string
          description: Type of the transaction to be queried.
          enum:
          - auto
          - user
          - meta
          - record
      - name: exclude_uncommitted
        in: query
        description: If set to `true` will exclude uncommitted transactions.
        required: false
        schema:
          type: boolean
      - name: include_proof
        in: query
        description: 'If set to `true`, includes the Merkle proof for the related transaction''s inclusion in the

          executed transaction log.'
        required: false
        schema:
          type: boolean
      - name: hash
        in: path
        description: Hash of the transaction to lookup
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Transaction data of the given transaction hash
          headers:
            x-supra-chain-id:
              schema:
                type: integer
                format: u-int8
                minimum: 0
              description: Chain ID of the current chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionV4'
  /rpc/v4/ws:
    get:
      tags:
      - WebSocket
      summary: Supra JSON-RPC WebSocket subscriptions (v4)
      description: "Opens a WebSocket connection over which clients may subscribe to Supra-formatted API data.\nServes data\
        \ for all VMs.\n\nThis is a `GET` request that upgrades to a WebSocket. Over the socket, a minimal JSON-RPC\n2.0 subscription\
        \ protocol is spoken (note: OpenAPI documents the upgrade handshake only,\nnot the pushed message stream):\n\n- `supra_subscribe\
        \ [\"newBlocks\", {\"includeTransactions\": <bool>, \"includeProof\": <bool>}]`\n  streams the full `BlockV4` for\
        \ each newly committed block (defaults: `includeTransactions =\n  true`, `includeProof = false`).\n- `supra_subscribe\
        \ [\"newBlockHeaders\"]` streams the `BlockHeaderInfo` only.\n- `supra_unsubscribe [\"<subscription-id>\"]` cancels\
        \ a subscription.\n\nThe subscribe response is `{\"jsonrpc\":\"2.0\",\"result\":\"<subscription-id>\",\"id\":<id>}`.\n\
        Notifications arrive as `{\"jsonrpc\":\"2.0\",\"method\":\"supra_subscription\",\"params\":\n{\"subscription\":\"\
        <id>\",\"result\":<BlockV4 | BlockHeaderInfo>}}`, reusing the same\nserialization as the REST block endpoint so a\
        \ single deserializer serves push and poll.\n\nWhen the node configures `websocket_auth_tokens`, clients must send\n\
        `Authorization: Bearer <token>`. Connection and subscription limits are enforced per token."
      operationId: supra_block_ws
      responses:
        '101':
          description: Switching protocols; the connection is upgraded to a WebSocket.
        '429':
          description: Connection or subscription limit reached.
          headers:
            Retry-After:
              schema:
                type: integer
                format: u-int32
                minimum: 0
              description: Seconds to wait before retrying.
            X-WebSocket-Reject-Reason:
              schema:
                type: string
              description: Reason the connection was rejected.
        '503':
          description: The Supra WebSocket endpoint is disabled on this node.
components:
  schemas:
    AccountAddress:
      type: string
      description: Hex encoded account address.
    AccountCoinStatementV1:
      type: object
      required:
      - record
      - cursor
      properties:
        record:
          type: array
          items:
            $ref: '#/components/schemas/TransactionInfoV1'
        cursor:
          type: integer
          format: u-int64
          minimum: 0
    AccountCoinStatementV2:
      type: object
      required:
      - record
      - cursor
      properties:
        record:
          type: array
          items:
            $ref: '#/components/schemas/TransactionInfoV2'
        cursor:
          type: integer
          format: u-int64
          minimum: 0
    AccountData:
      type: object
      description: Datatype that holds the sequence number and account authentication key.
      required:
      - sequence_number
      - authentication_key
      properties:
        sequence_number:
          type: integer
          format: u-int64
          minimum: 0
        authentication_key:
          $ref: '#/components/schemas/Hash'
    AccountStatementV1:
      type: object
      required:
      - record
      properties:
        record:
          type: array
          items:
            $ref: '#/components/schemas/TransactionInfoV1'
    AccountStatementV2:
      type: object
      required:
      - record
      properties:
        record:
          type: array
          items:
            $ref: '#/components/schemas/TransactionInfoV2'
    AccountStatementV3:
      type: array
      items:
        $ref: '#/components/schemas/TransactionV3'
      description: Account transactions of [TransactionV3] type.
    AccumulatorProof:
      type: object
      description: 'A proof that can be used authenticate an element in an accumulator given trusted root hash. For

        example, both `TransactionInclusionProof` and `EventEmissionProof` can be constructed on top of

        this structure.'
      required:
      - siblings
      properties:
        siblings:
          type: array
          items:
            $ref: '#/components/schemas/Hash'
          description: 'All siblings in this proof, including the default ones. Siblings are ordered from the bottom

            level to the root level.'
    Address:
      $ref: '#/components/schemas/AccountAddress'
      description: 'The address of an account


        This is represented in a string as a 64 character hex string, sometimes

        shortened by stripping leading 0s, and adding a 0x.'
    AuthorizedCommittee:
      oneOf:
      - type: object
        required:
        - V0
        properties:
          V0:
            $ref: '#/components/schemas/AuthorizedCommitteeV0'
      - type: object
        required:
        - V1
        properties:
          V1:
            $ref: '#/components/schemas/AuthorizedCommitteeV1'
      description: A versioned authorized committee, wrapping either V0 or V1.
    AuthorizedCommitteeV0:
      type: object
      description: A V0 authorized committee.
      required:
      - authorization
      - committee
      properties:
        authorization:
          $ref: '#/components/schemas/CommitteeAuthorization'
          description: The authorization certificate for this committee.
        committee:
          $ref: '#/components/schemas/CommitteeV0'
          description: The Committee authorized by the committee authorization.
    AuthorizedCommitteeV1:
      type: object
      description: A V1 authorized committee.
      required:
      - authorization
      - committee
      properties:
        authorization:
          $ref: '#/components/schemas/CommitteeAuthorization'
          description: The authorization certificate for this committee.
        committee:
          $ref: '#/components/schemas/CommitteeV1'
          description: The Committee authorized by the committee authorization.
    BatchHeader:
      type: object
      description: Batch metadata.
      required:
      - author
      - epoch_id
      - protocol
      - timestamp
      - aggregated_gas_price
      properties:
        author:
          $ref: '#/components/schemas/Identity'
          description: Public identity of the node that proposed the batch.
        epoch_id:
          $ref: '#/components/schemas/EpochId'
          description: Identifier of the epoch for which this batch was proposed.
        protocol:
          $ref: '#/components/schemas/SmrTransactionProtocol'
          description: The type of transactions contained in this batch.
        timestamp:
          $ref: '#/components/schemas/SmrTimestamp'
          description: Local time at which `author` created this batch in microseconds from the UNIX epoch.
        aggregated_gas_price:
          oneOf:
          - type: integer
            format: u-int64
            minimum: 0
          description: Aggregated gas unit price of the enclosed transactions.
    BinaryData:
      description: A type reserved for internal use to represent [HttpResponse] with binary data.
      default: null
    Block:
      type: object
      description: The API representation of a Supra block.
      required:
      - header
      properties:
        header:
          $ref: '#/components/schemas/BlockHeaderInfo'
          description: Metadata about the block.
        transactions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TransactionInfoV2'
          description: 'The API representations of all transactions contained in the block, in the order that

            they were executed.'
    BlockHeader:
      type: object
      required:
      - author
      - height
      - parent
      - timestamp
      - view
      properties:
        author:
          $ref: '#/components/schemas/Identity'
          description: Public identity of the node that proposed the block.
        height:
          oneOf:
          - type: integer
            format: u-int64
            minimum: 0
          description: Number of blocks before this block in the chain (including the genesis block).
        parent:
          $ref: '#/components/schemas/Hash'
          description: Hash digest of the previous block in the chain.
        timestamp:
          $ref: '#/components/schemas/SmrTimestamp'
          description: Local time at which `author` created this block in microseconds from the UNIX epoch.
        view:
          $ref: '#/components/schemas/View'
          description: Identifier of the view for which this block was proposed.
    BlockHeaderInfo:
      type: object
      description: Metadata about a Supra block.
      required:
