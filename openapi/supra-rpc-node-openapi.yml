      - type: string
        enum:
        - u256
    UnsignedSmrTransaction:
      type: object
      description: Defines unsigned transaction enclosing only header and payload information.
      required:
      - header
      - payload
      properties:
        header:
          $ref: '#/components/schemas/SmrTransactionHeader'
          description: Header of the transaction containing meta information of transaction.
        payload:
          type: object
          description: Actual payload of the transaction tagged based on the protocol type.
    VMStatus:
      oneOf:
      - type: string
        description: The VM status corresponding to an EXECUTED status code
        enum:
        - Executed
      - type: object
        description: 'Indicates an error from the VM, e.g. OUT_OF_GAS, INVALID_AUTH_KEY, RET_TYPE_MISMATCH_ERROR

          etc.

          The code will neither EXECUTED nor ABORTED'
        required:
        - Error
        properties:
          Error:
            type: object
            description: 'Indicates an error from the VM, e.g. OUT_OF_GAS, INVALID_AUTH_KEY, RET_TYPE_MISMATCH_ERROR

              etc.

              The code will neither EXECUTED nor ABORTED'
            required:
            - status_code
            properties:
              status_code:
                type: integer
                format: u-int16
                minimum: 0
              sub_status:
                type:
                - integer
                - 'null'
                format: u-int64
                minimum: 0
              message:
                type:
                - string
                - 'null'
      - type: object
        description: Indicates an `abort` from inside Move code. Contains the location of the abort and the code
        required:
        - MoveAbort
        properties:
          MoveAbort:
            type: array
            items:
              type: object
            description: Indicates an `abort` from inside Move code. Contains the location of the abort and the code
            maxItems: 2
            minItems: 2
      - type: object
        description: 'Indicates a failure from inside Move code, where the VM could not continue execution, e.g.

          dividing by zero or a missing resource'
        required:
        - ExecutionFailure
        properties:
          ExecutionFailure:
            type: object
            description: 'Indicates a failure from inside Move code, where the VM could not continue execution, e.g.

              dividing by zero or a missing resource'
            required:
            - status_code
            - location
            - function
            - code_offset
            properties:
              status_code:
                type: integer
                format: u-int16
                minimum: 0
              sub_status:
                type:
                - integer
                - 'null'
                format: u-int64
                minimum: 0
              location:
                type: string
              function:
                type: integer
                format: u-int16
                minimum: 0
              code_offset:
                type: integer
                format: u-int16
                minimum: 0
              message:
                type:
                - string
                - 'null'
      description: 'A VMStatus is represented as either

        - Executed indicating successful execution.

        - Error indicating an error from the VM itself.

        - MoveAbort indicating an abort occurred inside a Move program.'
    ValidatorPublicKeys:
      type: object
      description: 'The public keys held by a Supra validator.


        Intended to be stored in an unencrypted JSON file as a part of the validator''s public identity

        for easy access by the operator. Also intended to be published on-chain as part of the validator''s

        metadata.'
      required:
      - network_key
      - supra_keys
      properties:
        network_key:
          type: string
          description: The hex encoded public key corresponding to the network key.
        supra_keys:
          oneOf:
          - type: object
            required:
            - bls_multisig_key
            - bls_threshold_key_shares
            - class_group_key
            - ed25519_key
            properties:
              bls_multisig_key:
                type: string
                description: The hex encoded BLS multisig public key.
              bls_threshold_key_shares:
                type: object
                description: The hex encoded BLS threshold public key shares for each threshold type.
                additionalProperties:
                  type: string
                propertyNames:
                  type: string
                  enum:
                  - Validity
                  - Quorum
                  - Unanimous
                  - BcftValidity
                  - BcftQuorum
                  - BcftFallbackViewChange
                  - ClanMajority
              class_group_key:
                type: string
                description: The hex encoded class group public key.
              ed25519_key:
                type: string
                description: The hex encoded ED25519 public key.
          description: The public keys corresponding to the Supra-written code keys.
    ValidatorV0:
      type: object
      description: Information about a validator participating in a Committee.
      required:
      - ed25519_public_key
      - stake
      properties:
        bls_public_key_share:
          type:
          - string
          - 'null'
          description: The BLS public key share for consensus, if any.
        dkg_node_number:
          type:
          - integer
          - 'null'
          format: u-int32
          description: The position of the node in the DKG committee, if any.
          minimum: 0
        ed25519_public_key:
          type: string
          description: The ED25519 public key for consensus.
        stake:
          type: integer
          format: u-int64
          description: Stake of the validator.
          minimum: 0
    ValidatorV1:
      type: object
      description: Information about a validator participating in a V1 Committee.
      required:
      - keys
      - stake
      - stake_pool_address
      properties:
        dkg_node_number:
          type:
          - integer
          - 'null'
          format: u-int32
          description: The position of the node in the DKG committee, if any.
          minimum: 0
        keys:
          $ref: '#/components/schemas/ValidatorPublicKeys'
          description: The public keys used by the validator.
        stake:
          type: integer
          format: u-int64
          description: Stake of the validator.
          minimum: 0
        stake_pool_address:
          $ref: '#/components/schemas/AccountAddress'
          description: The Move account address of the validator's stake pool.
    VersionInfo:
      type: object
      description: JSON payload returned by `/rpc/v3/version`
      required:
      - version
      - branch
      - commit_hash
      - build_time
      - build_env
      properties:
        version:
          type: string
          description: SemVer coming from Cargo.toml
        branch:
          type: string
          description: Git branch used for the build
        commit_hash:
          type: string
          description: Full git commit hash
        build_time:
          type: string
          description: Timestamp produced by `build.rs`
        build_env:
          type: string
          description: Rust tool-chain used to build the binary
    View:
      type: object
      required:
      - epoch_id
      - round
      properties:
        epoch_id:
          $ref: '#/components/schemas/EpochId'
          description: Identifier of the consensus epoch.
        round:
          oneOf:
          - type: integer
            format: u-int64
            minimum: 0
          description: Identifier of the consensus round.
    ViewRequest:
      type: object
      description: View request for the Move View Function API.
      required:
      - function
      - type_arguments
      - arguments
      properties:
        function:
          type: object
        type_arguments:
          type: object
          description: Type arguments of the function
        arguments:
          type: object
          description: Arguments of the function
    Vm:
      type: string
      description: 'VM that produced a given transaction and its events. Determines which accumulator root in the

        shared `inclusion_certificate` a per-item `transaction_inclusion_proof` verifies against:

        `Move` → `movevm_merkle_accumulator_tree_root`, `Evm` → `evm_merkle_accumulator_tree_root`.'
      enum:
      - move
      - evm
    VoteType:
      type: string
      description: 'The different types of valid vote messages in Moonshot.

        '
      enum:
      - Commit
      - PrepareFallback
      - PrepareNormal
      - PrepareOptimistic
    u64:
      type: integer
      format: u-int64
      minimum: 0
