        sequence_number:
          type: string
        type:
          type: string
          description: The `MoveType` of the event
        data:
          description: The JSON representation of the event
        hash:
          type: string
          description: The hash of the event, derived from `RLP(event)` + `keccak256`.
    EventWithContextV3:
      type: object
