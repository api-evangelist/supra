      - transaction_hash
      properties:
        event:
          $ref: '#/components/schemas/EventV2'
        block_height:
          type: integer
          format: u-int64
          description: The height of the block where the event was emitted
          minimum: 0
        transaction_hash:
          $ref: '#/components/schemas/Hash'
        proofs:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/TransactionInclusionAndEventEmissionProof'
