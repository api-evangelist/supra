              schema:
                type: integer
                format: u-int8
                minimum: 0
              description: Chain ID of the current chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResource'
            application/x-bcs:
              schema:
                type: array
                items:
                  type: integer
                  format: u-int8
                  minimum: 0
            application/octet-stream:
              schema:
                type: array
                items:
                  type: integer
                  format: u-int8
                  minimum: 0
  /rpc/v3/accounts/{address}/transactions:
    get:
      tags:
      - Accounts
      summary: Get account transactions (v3)
      description: List of finalized transactions sent by the move account. Return max 100 transactions per request.
      operationId: get_account_transactions_v3
      parameters:
      - name: address
        in: path
        description: Address of account with or without a 0x prefix
        required: true
        schema:
          type: string
        example: '0x88fbd33f54e1126269769780feb24480428179f552e2313fbe571b72e62a1ca1'
      - name: count
        in: query
        description: Maximum number of items to return. Default is 20.
        required: false
        schema:
          type: integer
          minimum: 0
        style: form
      - name: start
        in: query
        description: 'Starting sequence number.


          If provided, return `:count` of transactions starting from this sequence number (inclusive)

          in the specified order.


          For order see `:ascending` flag.'
        required: false
        schema:
          type: integer
          format: u-int64
          minimum: 0
        style: form
      - name: ascending
        in: query
        description: 'Flag indicating order of lookup.


          Defaults to `false`; i.e. the transactions are returned in descending order by sequence number.

          If `true`, transactions are returned in ascending order by sequence number.'
        required: false
        schema:
          type: boolean
        style: form
      responses:
        '200':
          description: List of transactions from the move account.
          headers:
            x-supra-chain-id:
              schema:
                type: integer
                format: u-int8
                minimum: 0
              description: Chain ID of the current chain.
            x-supra-oldest-block:
              schema:
                type: integer
                format: u-int8
                minimum: 0
              description: Height of the oldest available block. Absent until the archive has indexed at least one block.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountStatementV3'
            application/x-bcs:
              schema:
                type: array
                items:
                  type: integer
                  format: u-int8
                  minimum: 0
            application/octet-stream:
              schema:
                type: array
                items:
                  type: integer
                  format: u-int8
                  minimum: 0
        '503':
          description: The archive is still initializing. No executed blocks are available yet. Please retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrResp'
components:
  schemas:
    EventV1:
      type: object
      description: On-chain event.
      required:
      - guid
      - sequence_number
      - type
      - data
      properties:
        guid:
          $ref: '#/components/schemas/Guid'
          description: The globally unique identifier of this event stream.
        sequence_number:
          type: string
        type:
          type: string
          description: The `MoveType` of the event
        data:
          description: The JSON representation of the event
    Address:
      $ref: '#/components/schemas/AccountAddress'
      description: 'The address of an account


        This is represented in a string as a 64 character hex string, sometimes

        shortened by stripping leading 0s, and adding a 0x.'
    MoveModule:
      type: object
      description: A Move module.
      required:
      - address
      - name
      - friends
      - exposed_functions
      - structs
      properties:
        address:
          $ref: '#/components/schemas/Address'
        name:
          type: object
        friends:
          type: object
          description: Friends of the module
        exposed_functions:
          type: object
          description: Public functions of the module
        structs:
          type: object
          description: Structs of the module
    TxExecutionStatus:
      type: string
      enum:
      - Success
      - Fail
      - Invalid
      - PendingAfterExecution
      - Pending
    EvmTransferKind:
      type: string
      enum:
      - call
      - create
      - create2
      - selfdestruct
    MoveResourcesResponse:
      type: object
      required:
      - resources
      - cursor
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/MoveResource'
          description: A list of Move Resources.
        cursor:
          type: string
          description: The hex-encoded bytes of the state key of the last resource in the list.
    TransactionV3:
      oneOf:
      - allOf:
        - $ref: '#/components/schemas/TransactionInfoV2'
        - type: object
          required:
          - txn_type
          properties:
            txn_type:
              type: string
              enum:
              - user
      - allOf:
        - $ref: '#/components/schemas/TransactionInfoV2'
        - type: object
          required:
          - txn_type
          properties:
            txn_type:
              type: string
              enum:
              - automated
      - allOf:
        - $ref: '#/components/schemas/BlockMetadataInfoV3'
        - type: object
          required:
          - txn_type
          properties:
            txn_type:
              type: string
              enum:
              - block_metadata
      - allOf:
        - $ref: '#/components/schemas/AutomationRecordInfoV3'
        - type: object
          required:
          - txn_type
          properties:
            txn_type:
              type: string
              enum:
              - automation_record
    Hash:
      type: string
      description: Hex encoded hash
    BlockMetadataInfoV3:
      type: object
      description: Details of block metadata transaction execution
      required:
      - hash
      - output
      - status
      properties:
        hash:
          $ref: '#/components/schemas/Hash'
        block_header:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BlockHeaderInfo'
            description: 'Metadata about the block containing the transaction, if any.

              This field will not be set for transactions that are returned as a part of a block.'
        output:
          $ref: '#/components/schemas/TransactionOutputV1'
        status:
          $ref: '#/components/schemas/TxExecutionStatus'
    TransactionOutputV1:
      oneOf:
      - type: object
        required:
        - Dkg
        properties:
          Dkg:
            $ref: '#/components/schemas/TxExecutionStatus'
      - type: string
        enum:
        - Empty
      - type: object
        required:
        - Move
        properties:
          Move:
            $ref: '#/components/schemas/MoveTransactionOutputV1'
      - type: object
        required:
        - Oracle
        properties:
          Oracle:
            $ref: '#/components/schemas/TxExecutionStatus'
      - type: object
        required:
        - Evm
        properties:
          Evm:
            $ref: '#/components/schemas/EvmTransactionOutput'
      description: '[crate::v1::TransactionOutputV1] with all fields in human-readable format.'
    AccountStatementV2:
      type: object
      required:
      - record
      properties:
        record:
          type: array
          items:
            $ref: '#/components/schemas/TransactionInfoV2'
    EvmTransferOperation:
      type: object
      description: This is a convenience structure wrapping [`TransferOperation`] to implement (de)serialization logic.
      required:
      - kind
      - from
      - to
      - value
      properties:
        kind:
          $ref: '#/components/schemas/EvmTransferKind'
          description: Source of the transfer call.
        from:
          type: string
          description: Sender of the transfer.
        to:
          type: string
          description: Receiver of the transfer.
        value:
          type: string
          description: Value of the transfer.
    AccountData:
      type: object
      description: Datatype that holds the sequence number and account authentication key.
      required:
      - sequence_number
      - authentication_key
      properties:
        sequence_number:
          type: integer
          format: u-int64
          minimum: 0
        authentication_key:
          $ref: '#/components/schemas/Hash'
    AccountStatementV3:
      type: array
      items:
        $ref: '#/components/schemas/TransactionV3'
      description: Account transactions of [TransactionV3] type.
    MoveResource:
      type: object
      description: A Move Resource.
      required:
      - type
      - data
      properties:
        type:
          type: string
        data:
          type: object
    MoveTransactionOutputV1:
      type: object
      description: The execution output of a Move transaction.
      required:
      - gas_used
      - events
      - vm_status
      properties:
        gas_used:
          type: integer
          format: u-int64
          description: The gas used by the transaction.
          minimum: 0
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventV1'
        vm_status:
          type: string
          description: A message summarizing the execution result produced by the MoveVM.
    EpochId:
      type: object
      required:
      - chain_id
      - epoch
      properties:
        chain_id:
          oneOf:
          - type: integer
            format: u-int8
            minimum: 0
          description: Unique identifier for this instance of the SMR.
        epoch:
          oneOf:
          - type: integer
            format: u-int64
            minimum: 0
          description: Identifier of the epoch within the context of `chain_id`.
    Guid:
      type: object
      description: A globally unique identifier derived from the sender's address and a counter
      required:
      - creation_number
      - account_address
      properties:
        creation_number:
          type: string
          description: If creation_num is `i`, this is the `i+1`th GUID created by `addr`
        account_address:
          $ref: '#/components/schemas/AccountAddress'
          description: Address that created the GUID
    BlockHeaderInfo:
      type: object
      description: Metadata about a Supra block.
      required:
      - author
      - hash
      - height
      - parent
      - timestamp
      - view
      properties:
        author:
          $ref: '#/components/schemas/Identity'
        hash:
          $ref: '#/components/schemas/Hash'
        height:
          oneOf:
          - type: integer
            format: u-int64
            minimum: 0
          description: Number of blocks before this block in the chain (including the genesis block).
        parent:
          $ref: '#/components/schemas/Hash'
        timestamp:
          $ref: '#/components/schemas/SmrTimestamp'
        view:
          $ref: '#/components/schemas/View'
    MoveModuleBytecode:
      type: object
      required:
      - bytecode
      - abi
      properties:
        bytecode:
          type: string
          description: Hex encoded bytecode
        abi:
          $ref: '#/components/schemas/MoveModule'
    SmrTimestamp:
      type: object
      required:
      - timestamp
      properties:
        timestamp:
          type: integer
          format: u-int64
          description: The timestamp as measured in the number of microseconds since the unix epoch.
          minimum: 0
    ErrResp:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    AccountAddress:
      type: string
      description: Hex encoded account address.
    AccountCoinStatementV2:
      type: object
      required:
      - record
      - cursor
      properties:
        record:
          type: array
          items:
            $ref: '#/components/schemas/TransactionInfoV2'
        cursor:
          type: integer
          format: u-int64
          minimum: 0
    MoveModuleListV2:
      type: object
      required:
      - modules
      properties:
        modules:
          type: array
          items:
            $ref: '#/components/schemas/MoveModuleBytecode'
        cursor:
          type:
          - string
          - 'null'
          description: 'Cursor specifying where to start for pagination.

            Use the cursor returned by the API when making the next request.'
    TransactionInfoV2:
      type: object
      description: Information about a Supra transaction.
      required:
      - authenticator
      - hash
      - header
      - payload
      - status
      properties:
        authenticator:
          type: object
          description: The cryptographic material that was submitted with the transaction, according to its type.
        block_header:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/BlockHeaderInfo'
            description: 'Metadata about the block containing the transaction, if any. This field should

              not be set if this [TransactionInfoV2] is yet to be included in a [Block].'
        hash:
          $ref: '#/components/schemas/Hash'
        header:
          $ref: '#/components/schemas/SmrTransactionHeader'
        payload:
          type: object
          description: The deserialized payload of the transaction according to its type.
        output:
          oneOf:
          - $ref: '#/components/schemas/TransactionOutputV1'
          - type: 'null'
        status:
          $ref: '#/components/schemas/TxExecutionStatus'
    EvmTransactionOutput:
      oneOf:
      - type: object
        description: Returned successfully
        required:
        - Success
        properties:
          Success:
            type: object
            description: Returned successfully
            required:
            - reason
            - gas_used
            - gas_refunded
            - logs
            - output
            properties:
              reason: {}
              gas_used:
                type: integer
                format: u-int64
                minimum: 0
              gas_refunded:
                type: integer
                format: u-int64
                minimum: 0
              logs: {}
              output: {}
              transfers:
                type: array
                items:
                  $ref: '#/components/schemas/EvmTransferOperation'
                description: A list of transfer operations during the transaction execution.
      - type: object
        description: Reverted by `REVERT` opcode that doesn't spend all gas.
        required:
        - Revert
        properties:
          Revert:
            type: object
            description: Reverted by `REVERT` opcode that doesn't spend all gas.
            required:
            - gas_used
            - output
            properties:
              gas_used:
                type: integer
                format: u-int64
                minimum: 0
              output:
                type: string
      - type: object
        description: Reverted for various reasons and spend all gas.
        required:
        - Halt
        properties:
          Halt:
            type: object
            description: Reverted for various reasons and spend all gas.
            required:
            - reason
            - gas_used
            properties:
              reason: {}
              gas_used:
                type: integer
                format: u-int64
                description: Halting will spend all the gas, and will be equal to gas_limit.
                minimum: 0
      - type: object
        description: Error occurred during execution.
        required:
        - Error
        properties:
          Error:
            type: object
            description: Error occurred during execution.
            required:
            - message
            properties:
              message:
                type: string
      description: API representation of the execution output of an Evm transaction.
    Identity:
      type: string
      description: Hex encoded identity.
    View:
      type: object
      required:
      - epoch_id
      - round
      properties:
        epoch_id:
          $ref: '#/components/schemas/EpochId'
          description: Identifier of the consensus epoch.
        round:
          oneOf:
          - type: integer
            format: u-int64
            minimum: 0
          description: Identifier of the consensus round.
    SmrTransactionHeader:
      type: object
      required:
      - chain_id
      - expiration_timestamp
      - sender
      - sequence_number
      - gas_unit_price
      - max_gas_amount
      properties:
        chain_id:
          type: integer
          format: u-int64
          description: 'The unique identifier for the instance of the Supra chain that this transaction should

            be executed upon.'
          minimum: 0
        expiration_timestamp:
          $ref: '#/components/schemas/SmrTimestamp'
          description: The time at which this transaction should be discarded if it has not been executed.
        sender:
          $ref: '#/components/schemas/AccountAddress'
          description: The standardized representation of the sender's account address in the target VM.
        sequence_number:
          oneOf:
          - type: integer
            format: u-int64
            minimum: 0
          description: The sequence number of the sender's account in the target VM.
        gas_unit_price:
          type: integer
          description: The amount of Supra that the sender is willing to pay per unit of gas.
          minimum: 0
        max_gas_amount:
          oneOf:
          - type: integer
            format: u-int64
            minimum: 0
          description: The maximum amount of gas that the sender is willing to spend.
