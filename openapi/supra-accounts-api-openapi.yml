      operationId: get_account_resources_v2
      parameters:
      - name: address
        in: path
        description: Address of account with or without a 0x prefix
        required: true
        schema:
          type: string
        example: '0x88fbd33f54e1126269769780feb24480428179f552e2313fbe571b72e62a1ca1'
      - name: count
