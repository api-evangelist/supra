description: >-
  Supra publishes one family of embeddable client-side components: price widgets for displaying live oracle
  crypto data on a third-party website. They are distinct from the SDKs in packages/ — these render UI rather
  than call an API on your behalf — and they are the only zero-key way to consume Supra's oracle data on a web
  page, since the Price Feeds REST/WebSocket APIs both require a manually issued x-api-key.
