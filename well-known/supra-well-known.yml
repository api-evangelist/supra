description: >-
  Supra serves no /.well-known/ discovery documents on any host. supra.com and docs.supra.com answer 404 with an
  HTML SPA shell for every path; rpc-mainnet.supra.com and rpc-testnet.supra.com answer a bare 404; the price
  feeds host prod-kline-rest.supra.com answers a Fastify JSON 404 ("Route GET:/.well-known/... not found"). No
  security.txt, no OpenID/OAuth metadata, no api-catalog, no ai-plugin.json, and no A2A agent card at either the
  current /.well-known/agent-card.json or the legacy /.well-known/agent.json path. Recorded as a measured
  absence — no WellKnown or SecurityTxt pointer is emitted in apis.yml, because none of these paths returned a
  document.
