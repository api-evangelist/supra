description: >-
  Supra publishes almost no rate-limit information. The REST node API declares no 429 response and no
  rate-limit headers on any of its 56 operations, so a client has no contract for behaviour under load. The one
  place throttling is declared is the WebSocket upgrade, which is modelled properly — 429 with Retry-After and a
  reason header — but with no published numbers. The price feeds APIs document none at all.
