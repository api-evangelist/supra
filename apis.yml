apis:
- name: Supra RPC Node API
  description: >-
    Public, keyless REST + JSON API served by every Supra RPC node. Covers accounts (resources, modules, coin and
    fungible-asset statements), transaction submission and simulation, gas price estimation, blocks and consensus
    blocks, events, Move view function execution, table item lookup, committee authorizations and event-emission /
    transaction-inclusion proofs, across four coexisting path versions (v1 through v4). Also exposes a JSON-RPC
    WebSocket upgrade at /rpc/v4/ws for newBlocks and newBlockHeaders subscriptions. Described by an OpenAPI 3.1.0
    document the node itself serves at /docs/api.json.
  humanURL: https://docs.supra.com/network/move/rest-api
  baseURL: https://rpc-mainnet.supra.com
  tags:
  - Blockchain
  - Layer 1
  - Smart Contracts
  - Move
  - Web3
