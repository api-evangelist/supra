aid: supra
name: Supra
description: >-
  Supra is a vertically integrated Layer 1 blockchain developed by the Swiss-based Entropy Foundation, combining a
  MultiVM execution layer (MoveVM plus an EVM) with services that most chains outsource: DORA native oracle price
  feeds (push and pull), decentralized verifiable randomness (dVRF), protocol-level automation (AutoFi), on-chain
  technical indicators and indices, and the SupraNova / HyperNova cross-chain bridge. Developers reach the network
  through a public, keyless REST + JSON node API at rpc-mainnet.supra.com that publishes a live OpenAPI 3.1
  description covering 56 operations across accounts, transactions, blocks, events, view functions, tables and
  inclusion proofs, plus a JSON-RPC WebSocket subscription stream for newly committed blocks. Market data is served
  separately by an API-key-gated Price Feeds REST and WebSocket API for real-time and historical OHLC data. Supra
  is headquartered in Miami, Florida and was founded in 2019.
