apis:
- name: Supra Price Feeds REST API
  description: >-
    Oracle market-data REST API returning the latest price for a trading pair and historical OHLC candles
    for up to one month, on the DORA data feeds Supra publishes on-chain. Two documented endpoints, GET
    /latest and GET /history. Requires an x-api-key header; keys are issued by request form, and the surface
    is documented as Early Access.
  humanURL: https://docs.supra.com/oracles/apis-real-time-and-historical-data/rest-api
  baseURL: https://prod-kline-rest.supra.com
  tags:
  - Oracle
  - Market Data
  - Cryptocurrency
  - Web3
  tags_raw:
  - Oracles
  - Market Data
  - Cryptocurrency
  - Web3
  properties:
  - type: Documentation
    url: https://docs.supra.com/oracles/apis-real-time-and-historical-data/rest-api
  - type: Authentication
    url: authentication/supra-authentication.yml
  - type: SignUp
    url: >-
      https://docs.google.com/forms/d/e/1FAIpQLSfHZr8BHLTY8q_MjbuKZPpdgQS0oGmRIrsn9H-HrieH9eQjFw/viewform
- name: Supra Price Feeds WebSocket API
  description: >-
    Streaming oracle market-data API. Clients open a WebSocket to wss://prod-kline-ws.supra.com with an
    x-api-key header and send a subscribe action naming the ohlc_datafeed channel, a resolution in minutes,
    and a list of trading pairs; the server pushes an OHLC update each interval.
  humanURL: https://docs.supra.com/oracles/apis-real-time-and-historical-data/websocket-api
  baseURL: wss://prod-kline-ws.supra.com
